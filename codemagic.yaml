workflows:
  zanako-android:
    name: Zanako Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create platform folders
        script: |
          flutter create --platforms=android --project-name zanako --org com.zanako.app .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate app icon
        script: |
          flutter pub run flutter_launcher_icons
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
